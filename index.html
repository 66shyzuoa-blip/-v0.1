<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#172018;color:#fff;font-family:system-ui,"Noto Sans TC",sans-serif;touch-action:none}
#game{position:absolute;inset:0}canvas{display:block}
#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.panel{background:#111c;color:#fff;border:1px solid #ffffff35;border-radius:10px;padding:8px 11px;backdrop-filter:blur(5px);font-size:13px;text-shadow:0 1px 2px #000}
#stats{min-width:148px}#bars{margin-top:5px;width:100%;height:7px;background:#512c2c;border-radius:6px;overflow:hidden}#hpbar{height:100%;width:100%;background:#d94b42}
#xpwrap{height:5px;background:#293b54;border-radius:5px;overflow:hidden;margin-top:5px}#xpbar{height:100%;width:0;background:#5bb7ff}
#timer{margin-left:auto;font-size:18px;font-weight:800}
#hint{pointer-events:none;position:absolute;top:140px;left:50%;transform:translateX(-50%);white-space:nowrap}
#stick{position:absolute;left:24px;bottom:26px;width:124px;height:124px;border-radius:50%;background:#ffffff20;border:2px solid #ffffff55;display:none;touch-action:none}
#knob{pointer-events:none;position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:#ffffffaa}
#skillModal,#endModal{position:absolute;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:20px}
.modal{width:min(520px,100%);background:#202b25;border:1px solid #ffffff55;border-radius:16px;padding:20px;box-shadow:0 10px 40px #0009}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
button{border:1px solid #d8c18b;background:#6d5732;color:#fff;border-radius:12px;padding:14px 9px;font-weight:700;font-size:14px;min-height:90px}
button:active{transform:scale(.97)}.sub{font-size:12px;color:#c9d3ca;font-weight:400;display:block;margin-top:7px}
#start{position:absolute;inset:0;background:linear-gradient(#101a16dd,#101a16ee);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
#start .modal{max-width:440px}#start button{min-height:48px;width:100%;margin-top:12px}
@media(min-width:800px){#stick{display:none!important}}
.panel,.modal{background:#211a13e8;border-color:#a58b57;color:#f4e4c3}#hint{top:115px;font-size:11px}#stick{bottom:36px;z-index:3;border-color:#bca16c}#start,#skillModal,#endModal{z-index:5} #stick{pointer-events:none;background:#ffffff18;border-color:#ffffff50}#knob{background:#ffffff59}#hint{z-index:2} @media(min-width:800px){#stick{display:none!important}} #skillModal .modal{animation:reveal .35s ease-out}.cards button{animation:reveal .45s both;min-width:0;padding:10px 4px;background:linear-gradient(#4c3923,#201810)}@keyframes reveal{from{opacity:0;transform:translateY(24px) scale(.92)}to{opacity:1;transform:none}}#mute{position:absolute;right:12px;top:65px;z-index:4;min-height:32px;padding:5px 9px;font-size:12px}</style>

const art=artURLs.map(u=>{let t=new THREE.TextureLoader().load(u);t.colorSpace=THREE.SRGBColorSpace;return t});
function makeWarrior(color,enemy=false){let g=new THREE.Group();let m=new THREE.SpriteMaterial({map:art[enemy?2:0],transparent:true,depthWrite:false});let sp=new THREE.Sprite(m);sp.center.set(.5,.04);sp.scale.set(enemy?1.65:1.48,enemy?2.05:2.35,1);g.add(sp);let sh=new THREE.Mesh(new THREE.CircleGeometry(.48,24),new THREE.MeshBasicMaterial({color:0x20170d,transparent:true,opacity:.3,depthWrite:false}));sh.rotation.x=-Math.PI/2;sh.scale.set(1,.65,1);sh.position.y=.02;g.add(sh);g.userData={sp,enemy};return g;}
function pose(g,dx,dz,t,moving){let sp=g.userData.sp;let dir=(Math.round(Math.atan2(-dx,dz)/(Math.PI/4))+8)%8;sp.material.map=art[(g.userData.enemy?8:0)+dir];sp.scale.x=Math.abs(sp.scale.x);sp.material.rotation=0;sp.position.y=0;}
const player=makeWarrior();scene.add(player);player.position.set(0,0,0);
const enemies=[],orbs=[];let hp=100,maxHp=100,xp=0,need=5,level=1,kills=0,elapsed=0,spawn=0,attack=0,paused=false,ended=false;
let damage=10,range=2.6,rate=1.2,area=1,regen=0,crit=0;
const ui=id=>document.getElementById(id);
function enemySpawn(){let a=Math.random()*Math.PI*2,r=13+Math.random()*5;let e=makeWarrior(Math.random()<.18?0x675b45:0x4a5551,true);e.position.set(player.position.x+Math.cos(a)*r,0,player.position.z+Math.sin(a)*r);scene.add(e);enemies.push({mesh:e,hp:Math.random()<.18?32:20,speed:1.3+Math.random()*.35,hit:0,boss:false});}
function orb(x,z){let m=new THREE.Mesh(new THREE.IcosahedronGeometry(.16,1),mat(0x45b9ff));m.position.set(x,.35,z);scene.add(m);orbs.push(m);}
const skills=[['強力斬擊','基本攻擊傷害 +5',()=>damage+=5],['快速攻擊','攻擊速度提升 20%',()=>rate*=.8],['旋風斬','攻擊範圍提升 35%',()=>area*=1.35],['劍氣','攻擊距離提升 1.2',()=>range+=1.2],['生命強化','最大生命 +25，恢復 25',()=>{maxHp+=25;hp=Math.min(maxHp,hp+25)}],['戰場威壓','每秒恢復 1 點生命',()=>regen+=1]];
let audio;let muted=false;function sound(freq,dur){if(!audio||muted)return;let o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(freq/3,audio.currentTime+dur);g.gain.setValueAtTime(.12,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}
function skillIcon(i){let paths=['M15 45L45 15M36 15H45V24','M12 24H44M12 34H38M12 44H30','M15 34A17 17 0 1 1 35 48M35 48L45 44','M10 46L48 10M20 48L50 20','M30 49C-5 25 15 8 30 22C45 8 65 25 30 49','M30 10L48 20V35L30 50L12 35V20Z'];return `<svg viewBox="0 0 60 60" width="48" height="48" style="display:block;margin:0 auto 8px;background:#241b12;border:1px solid #b89a5b;border-radius:8px"><path d="${paths[i]}" stroke="#f4d18a" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`}
function levelUp(){sound(650,.35);joyEnd();paused=true;let picks=[...skills].sort(()=>Math.random()-.5).slice(0,3);ui('skillCards').innerHTML='';picks.forEach(s=>{let b=document.createElement('button');b.style.animationDelay=(ui('skillCards').children.length*.12)+'s';b.innerHTML=skillIcon(skills.indexOf(s))+s[0]+'<span class="sub">'+s[1]+'</span>';b.onclick=()=>{sound(420,.2);s[2]();paused=false;ui('skillModal').style.display='none';};ui('skillCards').appendChild(b)});ui('skillModal').style.display='flex';}
function updateHud(){ui('level').textContent=level;ui('hp').textContent=Math.max(0,Math.ceil(hp));ui('maxhp').textContent=maxHp;ui('xp').textContent=xp;ui('need').textContent=need;ui('kills').textContent=kills;ui('hpbar').style.width=(hp/maxHp*100)+'%';ui('xpbar').style.width=(xp/need*100)+'%';}
function finish(win){joyEnd();ended=true;paused=true;ui('endTitle').textContent=win?'戰場勝利':'武將陣亡';ui('endText').textContent=`生存 ${Math.floor(elapsed)} 秒｜擊殺 ${kills}｜等級 ${level}`;ui('endModal').style.display='flex';}
const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let joy={x:0,y:0};const stick=ui('stick'),knob=ui('knob');let pointer=null;
let origin={x:0,y:0};function joyStart(e){if(pointer!==null||paused||ended||ui('start').style.display!=='none')return;pointer=e.pointerId;origin={x:e.clientX,y:e.clientY};stick.style.left=(origin.x-62)+'px';stick.style.top=(origin.y-62)+'px';stick.style.bottom='auto';stick.style.display='block';try{root.setPointerCapture(pointer)}catch{};joyMove(e)}function joyMove(e){if(pointer!==e.pointerId)return;let dx=e.clientX-origin.x,dy=e.clientY-origin.y,l=Math.hypot(dx,dy),m=42;if(l>m){dx*=m/l;dy*=m/l}joy.x=dx/m;joy.y=dy/m;knob.style.transform=`translate(${dx}px,${dy}px)`}function joyEnd(e){if(e&&e.pointerId!==pointer)return;pointer=null;joy.x=joy.y=0;stick.style.display='none';knob.style.transform='translate(0,0)'}root.addEventListener('pointerdown',joyStart);root.addEventListener('pointermove',joyMove);root.addEventListener('pointerup',joyEnd);root.addEventListener('pointercancel',joyEnd);root.addEventListener('lostpointercapture',joyEnd);addEventListener('blur',()=>joyEnd());
const effects=[];function slash(p){let m=new THREE.Mesh(new THREE.RingGeometry(.75,1.05,32,1,0,Math.PI*1.3),new THREE.MeshBasicMaterial({color:0xffdb83,transparent:true,opacity:.85,side:THREE.DoubleSide,depthWrite:false}));m.rotation.x=-Math.PI/2;m.position.copy(p);m.position.y=.3;scene.add(m);effects.push({m,t:.24});}let last=performance.now();function loop(now){requestAnimationFrame(loop);let dt=Math.min((now-last)/1000,.04);last=now;for(let i=effects.length-1;i>=0;i--){let e=effects[i];e.t-=dt;e.m.material.opacity=Math.max(0,e.t/.24);if(e.t<=0){scene.remove(e.m);e.m.geometry.dispose();e.m.material.dispose();effects.splice(i,1)}}if(!paused&&!ended&&ui('start').style.display==='none'){
 elapsed+=dt;spawn+=dt;attack+=dt;if(enemies.length<65&&spawn>Math.max(.35,1.35-elapsed*.008)){spawn=0;enemySpawn()}
 let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x,dz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joy.y;let l=Math.hypot(dx,dz);if(l>1){dx/=l;dz/=l}
 player.position.x+=dx*5*dt;player.position.z+=dz*5*dt;player.position.x=THREE.MathUtils.clamp(player.position.x,-65,65);player.position.z=THREE.MathUtils.clamp(player.position.z,-65,65);
 if(l>.1){player.userData.dx=dx;player.userData.dz=dz;}pose(player,player.userData.dx||1,player.userData.dz||1,elapsed,l>.1);
 if(regen)hp=Math.min(maxHp,hp+regen*dt);
 for(let e of enemies){let vx=player.position.x-e.mesh.position.x,vz=player.position.z-e.mesh.position.z,d=Math.hypot(vx,vz)||1;if(d>1.0){e.mesh.position.x+=vx/d*e.speed*dt;e.mesh.position.z+=vz/d*e.speed*dt;}pose(e.mesh,vx,vz,elapsed,d>1.0);e.hit-=dt;if(d<1.05&&e.hit<=0){hp-=5;e.hit=.9;sound(95,.12);slash(player.position)}}
 if(attack>=rate){attack=0;let target=null,best=range*area;for(let e of enemies){let d=e.mesh.position.distanceTo(player.position);if(d<best){best=d;target=e}}if(target){pose(player,target.mesh.position.x-player.position.x,target.mesh.position.z-player.position.z,elapsed,false);target.hp-=damage; sound(180,.16);slash(target.mesh.position);if(target.hp<=0){scene.remove(target.mesh);enemies.splice(enemies.indexOf(target),1);orb(target.mesh.position.x,target.mesh.position.z);kills++;}}}
 for(let i=orbs.length-1;i>=0;i--){let o=orbs[i];o.rotation.y+=dt*2;if(o.position.distanceTo(player.position)<.9){scene.remove(o);orbs.splice(i,1);xp++;if(xp>=need){xp-=need;level++;need=Math.ceil(need*1.35);levelUp()}}}
 if(elapsed>=600)finish(true);if(hp<=0)finish(false);
 ui('timer').textContent=String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(Math.floor(elapsed%60)).padStart(2,'0');updateHud();
}
camera.position.x=player.position.x;camera.position.z=player.position.z+17;camera.position.y=19;camera.lookAt(player.position.x,0,player.position.z);renderer.render(scene,camera);}
requestAnimationFrame(loop);
ui('mute').onclick=()=>{muted=!muted;ui('mute').textContent=muted?'音效：關':'音效：開'};
ui('startBtn').onclick=()=>{try{audio=new (window.AudioContext||window.webkitAudioContext)();audio.resume()}catch{};ui('start').style.display='none'};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
